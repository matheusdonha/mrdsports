<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRD Sports — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --verde:#69D473;--amarelo:#FEDD00;--dark:#0D1A0D;--dark2:#111C11;
  --surface:#1A261A;--surface2:#223022;--border:rgba(105,212,115,.15);
  --txt:#F0F7F0;--muted:#7A9A7A;--red:#FF4D4D;--orange:#FFB347;--blue:#5B9BD5;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Figtree',sans-serif;background:var(--dark);color:var(--txt);min-height:100vh}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,rgba(105,212,115,.12) 0%,transparent 70%)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:380px;text-align:center}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:var(--amarelo);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:2rem}
.login-box input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:15px;color:var(--txt);font-family:'Figtree',sans-serif;outline:none;margin-bottom:12px;text-align:center;letter-spacing:4px}
.login-box input:focus{border-color:var(--verde)}
.btn-login{width:100%;background:var(--verde);color:var(--dark);border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Figtree',sans-serif;transition:all .18s}
.btn-login:hover{background:#7de087;transform:translateY(-1px)}
.login-err{color:var(--red);font-size:13px;margin-top:10px;display:none}

/* APP */
#app{display:none}
header{background:var(--dark2);border-bottom:2px solid var(--verde);padding:0 1.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--amarelo)}
.hdr-logo span{color:var(--verde)}
.hdr-nav{display:flex;gap:6px}
.nav-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:'Figtree',sans-serif;transition:all .15s}
.nav-btn:hover,.nav-btn.active{background:var(--verde);border-color:var(--verde);color:var(--dark)}
.btn-logout{background:transparent;border:1.5px solid rgba(255,77,77,.3);color:var(--red);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Figtree',sans-serif}

.container{max-width:1100px;margin:0 auto;padding:1.75rem 1.25rem 5rem}
.view{display:none}.view.active{display:block}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--muted);border-left:3px solid var(--verde);padding-left:12px;margin-bottom:1.25rem}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:1.75rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--verde)}
.stat-card.am::before{background:var(--amarelo)}.stat-card.rd::before{background:var(--red)}.stat-card.bl::before{background:var(--blue)}.stat-card.or::before{background:var(--orange)}
.stat-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.5px;line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px}
.vd{color:var(--verde)}.am{color:var(--amarelo)}.rd{color:var(--red)}.bl{color:var(--blue)}.or{color:var(--orange)}

/* FORM */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.25rem;margin-bottom:1.25rem}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.form-group input,.form-group select,.form-group textarea{background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--txt);font-family:'Figtree',sans-serif;outline:none;transition:border-color .15s;width:100%}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--verde)}
.form-group select option{background:var(--surface2)}
.toggle-row{display:flex;gap:7px;flex-wrap:wrap}
.toggle-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;font-family:'Figtree',sans-serif;transition:all .15s}
.toggle-btn:hover{border-color:var(--verde);color:var(--verde)}
.toggle-btn.active{background:var(--verde);border-color:var(--verde);color:var(--dark)}
.divider{border:none;border-top:1px solid var(--border);margin:1.1rem 0}

/* ITEMS */
.itens-list{display:flex;flex-direction:column;gap:8px;margin-bottom:.75rem}
.item-row{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-row select,.item-row input{background:var(--dark2);border:1.5px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13px;color:var(--txt);font-family:'Figtree',sans-serif;outline:none;flex:1;min-width:85px}
.item-row input[type="number"]{max-width:70px}
.btn-del{background:rgba(255,77,77,.12);border:1px solid rgba(255,77,77,.2);color:var(--red);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:14px;flex-shrink:0;transition:all .15s}
.btn-del:hover{background:rgba(255,77,77,.25)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:'Figtree',sans-serif;transition:all .18s}
.btn-vd{background:var(--verde);color:var(--dark)}.btn-vd:hover{background:#7de087;transform:translateY(-1px)}
.btn-ol{background:transparent;border:1.5px solid var(--border);color:var(--muted)}.btn-ol:hover{border-color:var(--verde);color:var(--verde)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

.resumo-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:.75rem}
.resumo-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;color:var(--muted)}
.resumo-row.total{font-size:17px;font-weight:800;color:var(--txt);border-top:1px solid var(--border);margin-top:7px;padding-top:7px}
.resumo-row.com{color:var(--orange)}.resumo-row.liq{color:var(--verde)}

/* PEDIDOS */
.search-bar{display:flex;gap:10px;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
.search-bar input{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;font-size:14px;color:var(--txt);font-family:'Figtree',sans-serif;outline:none;flex:1;min-width:180px}
.search-bar input:focus{border-color:var(--verde)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:'Figtree',sans-serif;transition:all .15s}
.chip:hover{border-color:var(--verde);color:var(--verde)}
.chip.active{background:var(--verde);border-color:var(--verde);color:var(--dark)}
.pedidos-list{display:flex;flex-direction:column;gap:10px}
.pedido-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.pedido-hdr{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;cursor:pointer}
.pedido-hdr:hover{background:rgba(105,212,115,.04)}
.pedido-nome{font-weight:800;font-size:14px}
.pedido-meta{font-size:11px;color:var(--muted);margin-top:2px}
.pdg-badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-pago{background:rgba(105,212,115,.15);color:var(--verde);border:1px solid rgba(105,212,115,.3)}
.b-pend{background:rgba(255,179,71,.15);color:var(--orange);border:1px solid rgba(255,179,71,.3)}
.b-pg{background:rgba(91,155,213,.15);color:var(--blue);border:1px solid rgba(91,155,213,.3)}
.b-fora{background:rgba(254,221,0,.15);color:var(--amarelo);border:1px solid rgba(254,221,0,.3)}
.b-com{background:rgba(255,179,71,.1);color:var(--orange);border:1px solid rgba(255,179,71,.2)}
.pedido-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--verde)}
.pedido-body{display:none;border-top:1px solid var(--border);padding:12px 14px}
.pedido-body.open{display:block}
table.itb{width:100%;border-collapse:collapse;font-size:12px}
table.itb th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:5px 7px;border-bottom:1px solid var(--border);font-weight:700}
table.itb td{padding:7px 7px;border-bottom:1px solid rgba(105,212,115,.06);color:var(--txt)}
table.itb tr:last-child td{border-bottom:none}
.entrega-box{margin-top:10px;background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.9}
.entrega-box strong{color:var(--txt)}

/* FINANCEIRO */
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.5rem}
.fin-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem}
.fin-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.9rem}
.fin-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.fin-row:last-child{border-bottom:none}
.fin-lbl{color:var(--muted)}
.fin-val{font-weight:700}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:var(--verde)}.toast.error{border-color:var(--red)}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:14px}

@media(max-width:640px){
  header{padding:0 1rem}
  .container{padding:1rem .9rem 4rem}
  .fin-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">MRD Sports</div>
    <div class="login-sub">Painel Administrativo</div>
    <input type="password" id="senhaInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="btn-login" onclick="tryLogin()">Entrar</button>
    <div class="login-err" id="loginErr">Senha incorreta</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="hdr-logo">MRD <span>Admin</span></div>
    <div class="hdr-nav">
      <button class="nav-btn active" onclick="showView('nova',this)">🛒 Nova Venda</button>
      <button class="nav-btn" onclick="showView('pedidos',this)">📋 Pedidos</button>
      <button class="nav-btn" onclick="showView('fin',this)">📊 Financeiro</button>
    </div>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </header>

  <div class="container">

    <!-- NOVA VENDA -->
    <div class="view active" id="view-nova">
      <div class="sec-title">Nova Venda</div>
      <div class="form-card">
        <div class="form-grid">
          <div class="form-group">
            <label>Nome *</label>
            <input type="text" id="v-nome" placeholder="Nome do comprador">
          </div>
          <div class="form-group">
            <label>Telefone</label>
            <input type="text" id="v-tel" placeholder="(42) 99999-9999">
          </div>
          <div class="form-group">
            <label>Pagamento</label>
            <select id="v-pag">
              <option>Pix</option><option>Dinheiro</option><option>Cartão</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <div class="toggle-row">
              <button class="toggle-btn active" onclick="tog('v-status','Pago',this)">✅ Pago</button>
              <button class="toggle-btn" onclick="tog('v-status','Pendente',this)">⏳ Pendente</button>
            </div>
            <input type="hidden" id="v-status" value="Pago">
          </div>
        </div>

        <hr class="divider">

        <div class="form-group" style="margin-bottom:.9rem">
          <label>Localidade</label>
          <div class="toggle-row">
            <button class="toggle-btn active" onclick="setLoc('PG',this)">📍 Ponta Grossa</button>
            <button class="toggle-btn" onclick="setLoc('Fora',this)">🚚 Fora</button>
          </div>
        </div>

        <div id="entregaFields" style="display:none">
          <div class="form-grid" style="margin-bottom:.9rem">
            <div class="form-group"><label>CPF</label><input type="text" id="v-cpf" placeholder="000.000.000-00"></div>
            <div class="form-group"><label>CEP</label><input type="text" id="v-cep" placeholder="00000-000" oninput="buscaCEP(this.value)"></div>
            <div class="form-group"><label>Rua / Número</label><input type="text" id="v-rua" placeholder="Rua, 123"></div>
            <div class="form-group"><label>Bairro</label><input type="text" id="v-bairro" placeholder="Bairro"></div>
            <div class="form-group"><label>Cidade</label><input type="text" id="v-cidade" placeholder="Cidade"></div>
            <div class="form-group"><label>Frete (R$)</label><input type="number" id="v-frete" placeholder="0" min="0" step="0.01" oninput="calcResumo()"></div>
            <div class="form-group"><label>Embalagem (R$)</label><input type="number" id="v-emb" placeholder="0" min="0" step="0.01" oninput="calcResumo()"></div>
          </div>
        </div>

        <hr class="divider">

        <div class="form-group" style="margin-bottom:.9rem">
          <label>Comissionada?</label>
          <div class="toggle-row">
            <button class="toggle-btn active" onclick="setCom(false,this)">Não</button>
            <button class="toggle-btn" onclick="setCom(true,this)">Sim</button>
          </div>
        </div>
        <div id="comFields" style="display:none;margin-bottom:.9rem">
          <div class="form-group">
            <label>Comissionado</label>
            <div class="toggle-row">
              <button class="toggle-btn" onclick="tog('v-com','Maria',this)">Maria</button>
              <button class="toggle-btn" onclick="tog('v-com','Zuken',this)">Zuken</button>
              <button class="toggle-btn" onclick="tog('v-com','Helton',this)">Helton</button>
            </div>
            <input type="hidden" id="v-com" value="">
          </div>
        </div>

        <hr class="divider">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
          <label style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Itens</label>
          <button class="btn btn-ol" onclick="addItem()" style="padding:5px 12px;font-size:12px">+ Item</button>
        </div>
        <div class="itens-list" id="itensList"></div>

        <div class="resumo-box">
          <div class="resumo-row"><span>Subtotal</span><span id="r-sub">R$ 0,00</span></div>
          <div class="resumo-row com" id="r-com-row" style="display:none"><span>Comissão (10%)</span><span id="r-com">—</span></div>
          <div class="resumo-row" id="r-frete-row" style="display:none"><span>Frete + Embalagem</span><span id="r-frete">—</span></div>
          <div class="resumo-row total liq"><span>💰 Líquido</span><span id="r-liq">R$ 0,00</span></div>
        </div>

        <div style="display:flex;gap:10px;margin-top:1rem;flex-wrap:wrap">
          <button class="btn btn-vd" id="btnConf" onclick="confirmar()">✅ Confirmar Venda</button>
          <button class="btn btn-ol" onclick="resetForm()">🔄 Limpar</button>
        </div>
      </div>
    </div>

    <!-- PEDIDOS -->
    <div class="view" id="view-pedidos">
      <div class="sec-title">Pedidos</div>
      <div class="search-bar">
        <input type="text" id="searchQ" placeholder="Buscar por nome…" oninput="renderPedidos()">
        <div class="chips">
          <button class="chip active" onclick="setChip('todos',this)">Todos</button>
          <button class="chip" onclick="setChip('Pago',this)">Pagos</button>
          <button class="chip" onclick="setChip('Pendente',this)">Pendentes</button>
          <button class="chip" onclick="setChip('PG',this)">PG</button>
          <button class="chip" onclick="setChip('Fora',this)">Fora</button>
        </div>
      </div>
      <div class="pedidos-list" id="pedidosList"></div>
    </div>

    <!-- FINANCEIRO -->
    <div class="view" id="view-fin">
      <div class="sec-title">Financeiro</div>
      <div class="stats-grid" id="finStats"></div>
      <div class="fin-grid">
        <div class="fin-card"><div class="fin-title">📍 Por Localidade</div><div id="finLoc"></div></div>
        <div class="fin-card"><div class="fin-title">🤝 Comissionados</div><div id="finCom"></div></div>
        <div class="fin-card"><div class="fin-title">💳 Forma de Pagamento</div><div id="finPag"></div></div>
        <div class="fin-card"><div class="fin-title">👕 Por Modelo</div><div id="finMod"></div></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SENHA = "MRD@123";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKQTC4DSkYxOa0Kbc9VA7GevQbF-9e3vi7GWrw3L-GJYXiO9xjmkqnnLd6ozN7o61IjQ/exec";
const COM_PCT = 0.10;
const ESTOQUE = {
  Torcedor:{cores:["Amarela","Azul","Preta","Verde"],tamanhos:["P","M","G","GG","XGG"],preco:149},
  Jogador: {cores:["Amarela","Azul"],tamanhos:["P","M","G","GG"],preco:169},
  Feminina:{cores:["Amarela","Azul"],tamanhos:["P","M","G","GG"],preco:149},
  Retro:   {cores:["94","98","2002"],tamanhos:["M","G","GG"],preco:199},
};

let pedidos = JSON.parse(localStorage.getItem("mrd_pedidos")||"[]");
let loc="PG", comisionada=false, itemN=0, chipAtivo="todos";

// AUTH
function tryLogin(){
  if(document.getElementById("senhaInput").value===SENHA){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="block";
    init();
  } else {
    document.getElementById("loginErr").style.display="block";
    document.getElementById("senhaInput").value="";
  }
}
function logout(){
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("app").style.display="none";
}

// NAV
function showView(id,btn){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-"+id).classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  if(id==="pedidos") renderPedidos();
  if(id==="fin") renderFin();
}

// TOGGLES
function tog(inputId,val,btn){
  document.getElementById(inputId).value=val;
  btn.closest(".toggle-row").querySelectorAll(".toggle-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  calcResumo();
}
function setLoc(l,btn){
  loc=l;
  btn.closest(".toggle-row").querySelectorAll(".toggle-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("entregaFields").style.display=l==="Fora"?"block":"none";
  calcResumo();
}
function setCom(v,btn){
  comisionada=v;
  btn.closest(".toggle-row").querySelectorAll(".toggle-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("comFields").style.display=v?"block":"none";
  if(!v) document.getElementById("v-com").value="";
  calcResumo();
}

// CEP
async function buscaCEP(cep){
  const c=cep.replace(/\D/g,"");
  if(c.length!==8) return;
  try{
    const r=await fetch("https://viacep.com.br/ws/"+c+"/json/");
    const d=await r.json();
    if(!d.erro){
      document.getElementById("v-rua").value=d.logradouro||"";
      document.getElementById("v-bairro").value=d.bairro||"";
      document.getElementById("v-cidade").value=d.localidade||"";
    }
  }catch(e){}
}

// ITENS
function addItem(){
  itemN++;
  const n=itemN;
  const div=document.createElement("div");
  div.className="item-row";
  div.id="item-"+n;
  const modOpts=Object.keys(ESTOQUE).map(m=>`<option>${m}</option>`).join("");
  div.innerHTML=`
    <select onchange="updCores(${n})" id="im-${n}">${modOpts}</select>
    <select id="ic-${n}" onchange="updPreco(${n})"></select>
    <select id="it-${n}"></select>
    <input type="number" id="iq-${n}" value="1" min="1" style="max-width:60px" oninput="calcResumo()">
    <input type="number" id="ip-${n}" placeholder="Preço" min="0" step="0.01" style="max-width:85px" oninput="calcResumo()">
    <button class="btn-del" onclick="delItem(${n})">✕</button>`;
  document.getElementById("itensList").appendChild(div);
  updCores(n);
}
function updCores(n){
  const m=document.getElementById("im-"+n).value;
  const e=ESTOQUE[m];
  document.getElementById("ic-"+n).innerHTML=e.cores.map(c=>`<option>${c}</option>`).join("");
  document.getElementById("it-"+n).innerHTML=e.tamanhos.map(t=>`<option>${t}</option>`).join("");
  updPreco(n);
}
function updPreco(n){
  const m=document.getElementById("im-"+n).value;
  document.getElementById("ip-"+n).value=ESTOQUE[m].preco;
  calcResumo();
}
function delItem(n){
  const el=document.getElementById("item-"+n);
  if(el) el.remove();
  calcResumo();
}
function getItens(){
  const itens=[];
  document.querySelectorAll(".item-row").forEach(row=>{
    const n=row.id.replace("item-","");
    const modelo=document.getElementById("im-"+n)?.value||"";
    if(!modelo) return;
    itens.push({
      modelo,
      cor:document.getElementById("ic-"+n)?.value||"",
      tamanho:document.getElementById("it-"+n)?.value||"",
      qtd:parseInt(document.getElementById("iq-"+n)?.value)||1,
      preco:parseFloat(document.getElementById("ip-"+n)?.value)||0,
    });
  });
  return itens;
}

const fmt=v=>"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});

function calcResumo(){
  const itens=getItens();
  const sub=itens.reduce((s,i)=>s+i.preco*i.qtd,0);
  const frete=parseFloat(document.getElementById("v-frete")?.value)||0;
  const emb=parseFloat(document.getElementById("v-emb")?.value)||0;
  const custos=frete+emb;
  const com=comisionada?sub*COM_PCT:0;
  const liq=sub-com-custos;

  document.getElementById("r-sub").textContent=fmt(sub);
  document.getElementById("r-com-row").style.display=comisionada?"flex":"none";
  document.getElementById("r-com").textContent="— "+fmt(com);
  document.getElementById("r-frete-row").style.display=custos>0?"flex":"none";
  document.getElementById("r-frete").textContent="— "+fmt(custos);
  document.getElementById("r-liq").textContent=fmt(liq);
}

// CONFIRMAR
async function confirmar(){
  const nome=document.getElementById("v-nome").value.trim();
  if(!nome){toast("⚠ Informe o nome","error");return;}
  const itens=getItens();
  if(!itens.length){toast("⚠ Adicione um item","error");return;}
  if(comisionada&&!document.getElementById("v-com").value){toast("⚠ Selecione o comissionado","error");return;}

  const sub=itens.reduce((s,i)=>s+i.preco*i.qtd,0);
  const frete=parseFloat(document.getElementById("v-frete")?.value)||0;
  const emb=parseFloat(document.getElementById("v-emb")?.value)||0;
  const custos=frete+emb;
  const com=comisionada?sub*COM_PCT:0;
  const liq=sub-com-custos;

  const entrega=loc==="Fora"?{
    cpf:document.getElementById("v-cpf").value.trim(),
    cep:document.getElementById("v-cep").value.trim(),
    rua:document.getElementById("v-rua").value.trim(),
    bairro:document.getElementById("v-bairro").value.trim(),
    cidade:document.getElementById("v-cidade").value.trim(),
  }:null;

  const pedido={
    id:Date.now(),
    data:new Date().toLocaleDateString("pt-BR"),
    hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
    nome,
    tel:document.getElementById("v-tel").value.trim(),
    pagamento:document.getElementById("v-pag").value,
    status:document.getElementById("v-status").value,
    loc, comisionada,
    comisionado:document.getElementById("v-com").value,
    itens, sub, com, custos, liq, frete, emb, entrega,
  };

  const btn=document.getElementById("btnConf");
  btn.disabled=true; btn.textContent="Salvando…";

  pedidos.unshift(pedido);
  localStorage.setItem("mrd_pedidos",JSON.stringify(pedidos));

  // Monta linhas para o Sheets — uma linha por item
  const rows = pedido.itens.map(item => [
    pedido.data,                          // Data
    pedido.hora,                          // Hora
    pedido.nome,                          // Comprador
    pedido.tel,                           // Telefone
    item.modelo,                          // Modelo
    item.cor,                             // Cor
    item.tamanho,                         // Tamanho
    item.qtd,                             // Qtd
    item.preco,                           // Preço Unit
    item.preco * item.qtd,                // Total Item
    pedido.pagamento,                     // Pagamento
    pedido.status,                        // Status
    pedido.loc,                           // Localidade
    pedido.comisionada ? "Sim" : "Não",   // Comissionada
    pedido.comisionado || "",             // Comissionado
    pedido.comisionada ? parseFloat((item.preco * item.qtd * COM_PCT).toFixed(2)) : 0, // Comissão
    pedido.frete || 0,                    // Frete
    pedido.emb || 0,                      // Embalagem
    parseFloat(pedido.liq.toFixed(2)),    // Líquido
    pedido.entrega ? pedido.entrega.cpf    : "", // CPF
    pedido.entrega ? pedido.entrega.cep    : "", // CEP
    pedido.entrega ? pedido.entrega.rua    : "", // Rua
    pedido.entrega ? pedido.entrega.bairro : "", // Bairro
    pedido.entrega ? pedido.entrega.cidade : "", // Cidade
  ]);

  try {
    // no-cors: Google Apps Script requer isso quando chamado de outro domínio
    // A gravação ocorre normalmente, mas não conseguimos ler a resposta
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify({rows}),
    });
    toast("✅ Venda salva! "+nome,"success");
  } catch(e) {
    console.warn("Sheets:", e);
    toast("⚠ Salvo localmente apenas. Verifique conexão.","error");
  }

  btn.disabled=false; btn.textContent="✅ Confirmar Venda";
  resetForm();
}

// RESET
function resetForm(){
  ["v-nome","v-tel","v-cpf","v-cep","v-rua","v-bairro","v-cidade"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.value="";
  });
  ["v-frete","v-emb"].forEach(id=>{const el=document.getElementById(id);if(el)el.value="";});
  document.getElementById("v-com").value="";
  document.getElementById("v-status").value="Pago";
  document.getElementById("itensList").innerHTML="";
  itemN=0; loc="PG"; comisionada=false;
  document.getElementById("entregaFields").style.display="none";
  document.getElementById("comFields").style.display="none";
  document.querySelectorAll(".toggle-row").forEach(row=>{
    row.querySelectorAll(".toggle-btn").forEach(b=>b.classList.remove("active"));
    const first=row.querySelector(".toggle-btn");
    if(first) first.classList.add("active");
  });
  addItem();
  calcResumo();
}

// PEDIDOS
let chipAtual="todos";
function setChip(f,btn){
  chipAtual=f;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  btn.classList.add("active");
  renderPedidos();
}
function renderPedidos(){
  const q=(document.getElementById("searchQ")?.value||"").toLowerCase();
  const lista=document.getElementById("pedidosList");
  let filtered=pedidos.filter(p=>{
    const ms=!q||p.nome.toLowerCase().includes(q);
    const mc=chipAtual==="todos"||p.status===chipAtual||p.loc===chipAtual;
    return ms&&mc;
  });
  if(!filtered.length){lista.innerHTML='<div class="empty">Nenhum pedido encontrado.</div>';return;}
  lista.innerHTML=filtered.map(p=>`
    <div class="pedido-card">
      <div class="pedido-hdr" onclick="togPed(${p.id})">
        <div>
          <div class="pedido-nome">${p.nome}</div>
          <div class="pedido-meta">${p.data} ${p.hora} · ${p.tel||"—"} · ${p.pagamento}</div>
        </div>
        <div class="pdg-badges">
          <span class="badge ${p.status==="Pago"?"b-pago":"b-pend"}">${p.status}</span>
          <span class="badge ${p.loc==="PG"?"b-pg":"b-fora"}">${p.loc}</span>
          ${p.comisionada?`<span class="badge b-com">🤝 ${p.comisionado}</span>`:""}
        </div>
        <div class="pedido-val">${fmt(p.liq)}</div>
      </div>
      <div class="pedido-body" id="pb-${p.id}">
        <table class="itb">
          <thead><tr><th>Modelo</th><th>Cor</th><th>Tam.</th><th>Qtd</th><th>Unit.</th><th>Total</th></tr></thead>
          <tbody>${p.itens.map(i=>`<tr><td>${i.modelo}</td><td>${i.cor}</td><td>${i.tamanho}</td><td>${i.qtd}</td><td>${fmt(i.preco)}</td><td>${fmt(i.preco*i.qtd)}</td></tr>`).join("")}</tbody>
        </table>
        ${p.entrega?`<div class="entrega-box">🚚 <strong>Entrega:</strong> ${p.entrega.rua}, ${p.entrega.bairro} — ${p.entrega.cidade} · CEP ${p.entrega.cep} · CPF ${p.entrega.cpf}</div>`:""}
        ${p.comisionada?`<div style="margin-top:10px;font-size:12px;color:var(--orange)">🤝 Comissão ${p.comisionado}: ${fmt(p.com)}</div>`:""}
        ${p.custos>0?`<div style="margin-top:6px;font-size:12px;color:var(--muted)">📦 Frete+Emb: ${fmt(p.custos)}</div>`:""}
      </div>
    </div>`).join("");
}
function togPed(id){
  const el=document.getElementById("pb-"+id);
  if(el) el.classList.toggle("open");
}

// FINANCEIRO
function renderFin(){
  const tot=pedidos.reduce((s,p)=>s+p.sub,0);
  const comT=pedidos.reduce((s,p)=>s+(p.com||0),0);
  const cusT=pedidos.reduce((s,p)=>s+(p.custos||0),0);
  const liqT=pedidos.reduce((s,p)=>s+p.liq,0);
  const pendT=pedidos.filter(p=>p.status==="Pendente").reduce((s,p)=>s+p.liq,0);
  const camsT=pedidos.reduce((s,p)=>s+p.itens.reduce((ss,i)=>ss+i.qtd,0),0);

  document.getElementById("finStats").innerHTML=`
    <div class="stat-card am"><div class="stat-lbl">Faturamento Bruto</div><div class="stat-val am">${fmt(tot)}</div></div>
    <div class="stat-card"><div class="stat-lbl">Lucro Líquido</div><div class="stat-val vd">${fmt(liqT)}</div><div class="stat-sub">após comissões e custos</div></div>
    <div class="stat-card rd"><div class="stat-lbl">A Receber</div><div class="stat-val rd">${fmt(pendT)}</div><div class="stat-sub">${pedidos.filter(p=>p.status==="Pendente").length} pendentes</div></div>
    <div class="stat-card bl"><div class="stat-lbl">Camisas Vendidas</div><div class="stat-val bl">${camsT}</div></div>
    <div class="stat-card or"><div class="stat-lbl">Total Comissões</div><div class="stat-val or">${fmt(comT)}</div></div>
    <div class="stat-card"><div class="stat-lbl">Pedidos</div><div class="stat-val">${pedidos.length}</div></div>`;

  // Localidade
  const pg=pedidos.filter(p=>p.loc==="PG"),fora=pedidos.filter(p=>p.loc==="Fora");
  document.getElementById("finLoc").innerHTML=`
    <div class="fin-row"><span class="fin-lbl">📍 Ponta Grossa</span><div style="text-align:right"><span class="fin-val bl">${fmt(pg.reduce((s,p)=>s+p.liq,0))}</span><div style="font-size:11px;color:var(--muted)">${pg.length} pedidos · ${pg.reduce((s,p)=>s+p.itens.reduce((ss,i)=>ss+i.qtd,0),0)} camisas</div></div></div>
    <div class="fin-row"><span class="fin-lbl">🚚 Fora</span><div style="text-align:right"><span class="fin-val am">${fmt(fora.reduce((s,p)=>s+p.liq,0))}</span><div style="font-size:11px;color:var(--muted)">${fora.length} pedidos · ${fora.reduce((s,p)=>s+p.itens.reduce((ss,i)=>ss+i.qtd,0),0)} camisas</div></div></div>`;

  // Comissionados
  const comMap={};
  pedidos.filter(p=>p.comisionada).forEach(p=>{
    if(!comMap[p.comisionado])comMap[p.comisionado]={n:0,v:0};
    comMap[p.comisionado].n++;comMap[p.comisionado].v+=p.com||0;
  });
  document.getElementById("finCom").innerHTML=Object.entries(comMap).length
    ?Object.entries(comMap).map(([k,d])=>`<div class="fin-row"><span class="fin-lbl">🤝 ${k}</span><div style="text-align:right"><span class="fin-val or">${fmt(d.v)}</span><div style="font-size:11px;color:var(--muted)">${d.n} venda(s)</div></div></div>`).join("")
    :`<div style="color:var(--muted);font-size:13px;padding:8px 0">Nenhuma venda comissionada</div>`;

  // Pagamento
  const pagMap={};
  pedidos.forEach(p=>{pagMap[p.pagamento]=(pagMap[p.pagamento]||0)+p.liq;});
  document.getElementById("finPag").innerHTML=Object.entries(pagMap).map(([k,v])=>
    `<div class="fin-row"><span class="fin-lbl">${k}</span><span class="fin-val vd">${fmt(v)}</span></div>`).join("")||`<div style="color:var(--muted);font-size:13px">Sem dados</div>`;

  // Modelo
  const modMap={};
  pedidos.forEach(p=>p.itens.forEach(i=>{
    if(!modMap[i.modelo])modMap[i.modelo]={q:0,v:0};
    modMap[i.modelo].q+=i.qtd;modMap[i.modelo].v+=i.preco*i.qtd;
  }));
  document.getElementById("finMod").innerHTML=Object.entries(modMap).map(([k,d])=>
    `<div class="fin-row"><span class="fin-lbl">${k}</span><div style="text-align:right"><span class="fin-val vd">${fmt(d.v)}</span><div style="font-size:11px;color:var(--muted)">${d.q} unid.</div></div></div>`).join("")||`<div style="color:var(--muted);font-size:13px">Sem dados</div>`;
}

// TOAST
function toast(msg,type=""){
  const t=document.getElementById("toast");
  t.textContent=msg;t.className=`toast ${type} show`;
  setTimeout(()=>t.classList.remove("show"),3500);
}

// INIT
function init(){addItem();calcResumo();}
</script>
</body>
</html>
